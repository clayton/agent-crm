[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-crm"
version = "0.3.0"
description = "A local, agent-first CRM backed by SQLite"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://crmemento.com"
Repository = "https://github.com/clayton/agent-crm"
Issues = "https://github.com/clayton/agent-crm/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
crm = "agent_crm.cli:main"
crm-mcp = "agent_crm.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_crm"]
